<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #bfbfbf;
        }
        header {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
        header button {
            color: white;
            background-color: #444;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        header button.active {
            background-color: #007bff;
        }
        section {
            margin: 20px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            border-radius: 15px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
            overflow-x: auto;
            font-size: large;
            border-radius: 15px;
        }
    </style>
    <script>
        function showSimulation(index) {
            const simulations = [
                {
                    src: "https://www.tinkercad.com/embed/j6ZFxsHyUWy?editbtn=1",
                    info: `Perception Layer
The perception layer is responsible for sensing and collecting environmental data.

Components:
- Temperature sensors: Measure ambient temperature (e.g., TMP36).

Role:
- Captures real-time temperature data from the environment.
- Serves as the input layer for subsequent data processing.


Role:

- continuous monitoring of temperature
`
                },
                {
                    src: "https://www.tinkercad.com/embed/4dXQlrRuO0V?editbtn=1",
                    info: `Perception Layer
The perception layer involves collecting real-time data using sensors and devices installed in the irrigation system.

Components of the Smart Irrigation System :

-Soil Moisture Sensor: Measures soil water levels.
-Microcontroller (e.g., Arduino/Raspberry Pi): Processes sensor data.
-Water Pump: Controls water flow based on sensor data.

 Working Principle :

-Sensors detect moisture levels in the soil.
-If soil is dry, the microcontroller activates the water pump.
-Once the required moisture level is reached, the pump stops.

 Advantages :
 
-Water Conservation: Reduces unnecessary water usage.
-Automation: Eliminates manual intervention.
-Remote Monitoring: Access system status from anywhere.
-Cost-Effective: Saves money in the long run by reducing water bills.
-Scalability: Can be expanded to large farms and gardens.

 Disadvantages :

-Initial setup cost.
-Internet connectivity dependency.
-Sensor maintenance and calibration.

 Real World Applications :
 
-Agriculture: Increases crop yield and sustainability.
-Home Gardens: Helps maintain lawns and potted plants efficiently.
-Greenhouses: Maintains optimal growing conditions.
-Parks & Public Spaces: Ensures efficient watering of landscapes.

Future Enhancements:

-AI-based predictive watering.
-Solar-powered irrigation systems.
-Integration with weather forecasts.`
                },
                {
                    src: "https://www.tinkercad.com/embed/jifmtOiPgPa?editbtn=1",
                    info: `Perception Layer
This layer is responsible for capturing real-time soil pH data using sensors.

Components:
- pH sensors or probes to measure soil acidity/alkalinity levels.

Role:
- Collects raw data from the soil, including pH value
- Acts as the foundational layer for data acquisition.

Role:
- Ensures secure, low-latency transfer of soil pH data to storage and processing systems.
- Supports real-time monitoring and control functionality.
`
                }
            ];

            // Update iframe src instead of srcdoc
            document.getElementById("simulationFrame").src = simulations[index].src;

            // Update info text properly
            document.getElementById("simulationInfo").innerText = simulations[index].info;

            // Update button active state
            const buttons = document.querySelectorAll("header button");
            buttons.forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            showSimulation(0); // Load default simulation
        });
    </script>
</head>
<body>
    <header>
        <button onclick="showSimulation(0)">Temperature Sensor</button>
        <button onclick="showSimulation(1)">Smart Irrigation</button>
        <button onclick="showSimulation(2)">Soil pH Sensor</button>
    </header>

    <section>
        <iframe id="simulationFrame" src="" frameborder="0" scrolling="no"></iframe>
        <hr>
        
        <pre id="simulationInfo"></pre>
        <hr>
    </section>
</body>
</html>
