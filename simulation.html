<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #bfbfbf;
        }
        header {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
        header button {
            color: white;
            background-color: #444;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        header button.active {
            background-color: #007bff;
        }
        section {
            margin: 20px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            border-radius: 15px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
            overflow-x: auto;
            font-size: large;
            border-radius: 15px;
        }
    </style>
    <script>
        function showSimulation(index) {
            const simulations = [
                {
                    src: "https://www.tinkercad.com/embed/4dXQlrRuO0V?editbtn=1",
                    info: `Perception Layer
The perception layer is responsible for sensing and collecting environmental data.

Components:
- Temperature sensors: Measure ambient temperature (e.g., TMP36).

Role:
- Captures real-time temperature data from the environment.
- Serves as the input layer for subsequent data processing.


Role:

- continuous monitoring of temperature
`
                },
                {
                    src: "https://www.tinkercad.com/embed/4dXQlrRuO0V?editbtn=1",
                    info: `Perception Layer
The perception layer involves collecting real-time data using sensors and devices installed in the irrigation system.

Components:
- Soil moisture sensors to monitor soil hydration levels.
- Flow meters to measure water usage.

Role:
- Collects raw data like soil moisture and water levels.
- Acts as the foundation for all subsequent processing and decision-making.

Network/Transport Layer
The network/transport layer ensures seamless data transmission between the perception layer and the data storage/processing systems.


Role:
- Facilitates efficient water management system`
                },
                {
                    src: "https://www.tinkercad.com/embed/jifmtOiPgPa?editbtn=1",
                    info: `Perception Layer
This layer is responsible for capturing real-time soil pH data using sensors.

Components:
- pH sensors or probes to measure soil acidity/alkalinity levels.

Role:
- Collects raw data from the soil, including pH value
- Acts as the foundational layer for data acquisition.

Role:
- Ensures secure, low-latency transfer of soil pH data to storage and processing systems.
- Supports real-time monitoring and control functionality.
`
                }
            ];

            // Update iframe src instead of srcdoc
            document.getElementById("simulationFrame").src = simulations[index].src;

            // Update info text properly
            document.getElementById("simulationInfo").innerText = simulations[index].info;

            // Update button active state
            const buttons = document.querySelectorAll("header button");
            buttons.forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            showSimulation(0); // Load default simulation
        });
    </script>
</head>
<body>
    <header>
        <button onclick="showSimulation(0)">Temperature Sensor</button>
        <button onclick="showSimulation(1)">Smart Irrigation</button>
        <button onclick="showSimulation(2)">Soil pH Sensor</button>
    </header>

    <section>
        <iframe id="simulationFrame" src="" frameborder="0" scrolling="no"></iframe>
        <hr>
        <h2>IoT Architecture</h2>
        <pre id="simulationInfo"></pre>
        <hr>
    </section>
</body>
</html>
